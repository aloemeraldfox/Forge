name: Build Forge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Create Flutter project scaffold
        run: flutter create --org com.alo --project-name forge --platforms android .tmp_forge

      - name: Overlay our files
        run: |
          cp lib/main.dart .tmp_forge/lib/main.dart
          cp pubspec.yaml .tmp_forge/pubspec.yaml

      - name: Install dependencies
        working-directory: .tmp_forge
        run: flutter pub get

      - name: Build APK
        working-directory: .tmp_forge
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forge-APK
          path: .tmp_forge/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30