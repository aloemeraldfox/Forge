name: Build Forge APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # also lets you trigger manually from GitHub mobile

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      # Upload APK so you can download it straight from GitHub mobile
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forge-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
