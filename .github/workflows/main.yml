name: Build Forge APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Patch flutter_inappwebview_android compileSdk to 34
        run: |
          find ~/.pub-cache -path "*/flutter_inappwebview_android*/android/build.gradle" | while read f; do
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' "$f"
            sed -i 's/compileSdk [0-9]*/compileSdk 34/g' "$f"
            echo "Patched: $f"
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forge-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
