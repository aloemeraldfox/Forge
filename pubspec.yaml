name: lotus
description: Load any HTML/JSX/web file and run it as a native app.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  file_picker: ^8.0.0
  path_provider: ^2.0.0
  shared_preferences: ^2.0.0
  share_plus: ^9.0.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/builtin/egyptianlibrary.jsx
    - assets/builtin/greeklibrary.jsx
    - assets/builtin/norselibrary.jsx
    - assets/builtin/celticlibrary.jsx
    - assets/builtin/japaneselibrary.jsx
    - assets/builtin/magicresearch.jsx